<!-- 上傳區塊 -->
<div style="display: flex; align-items: center; gap: 12px; flex-wrap: nowrap;">
  <input type="file" (change)="onFileSelected($event)" multiple style="flex: 1 1 auto; max-width: 300px;">
  <button mat-stroked-button color="primary" (click)="uploadFiles()" [disabled]="!selectedFiles.length || uploading">
    {{ uploading ? '上傳中...' : '上傳附件' }}
  </button>
</div>

<!-- 附件清單 -->
<div *ngIf="attachments.length" style="margin-top: 8px;">
  <div style="font-weight: 500; margin-bottom: 4px;">📎 附件</div>
  <div *ngFor="let attachment of attachments" style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
    <a href="#" (click)="downloadFile($event, attachment)" style="word-break: break-word;">
      {{ attachment }}
    </a>
    <button mat-button color="warn" (click)="deleteAttachment(attachment)">刪除</button>
  </div>
</div>
