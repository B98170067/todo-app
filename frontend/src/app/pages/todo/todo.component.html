<!-- 標題 -->
<h1 style="text-align: center; margin-top: 24px; font-weight: 500;">📋 我的待辦清單</h1>

<!-- 導覽列 -->
<app-navbar />

<!-- 輸入框區塊 -->
<div style="max-width: 600px; margin: 0 auto 32px auto; padding: 0 16px;">
  <mat-form-field appearance="fill" style="width: 100%;">
    <mat-label>新增待辦事項</mat-label>
    <input matInput [(ngModel)]="newTitle" (keyup.enter)="addTodo()" />
  </mat-form-field>

  <div style="text-align: right; margin-top: 8px;">
    <button mat-raised-button color="primary" (click)="addTodo()">新增</button>
  </div>
</div>

<!-- 篩選控制 -->
<div style="max-width: 600px; margin: 0 auto 16px auto; text-align: right; padding: 0 16px;">
  <mat-button-toggle-group [(ngModel)]="filter" aria-label="Filter todos">
    <mat-button-toggle value="all">全部</mat-button-toggle>
    <mat-button-toggle value="active">未完成</mat-button-toggle>
    <mat-button-toggle value="completed">已完成</mat-button-toggle>
  </mat-button-toggle-group>
</div>

<!-- 待辦清單 -->
<div style="max-width: 600px; margin: 0 auto; padding: 0 16px;">
  <mat-list>
    <mat-list-item *ngFor="let todo of filteredTodos()" style="align-items: center;">
      <mat-checkbox [checked]="todo.completed" (change)="toggleCompleted(todo)">
      </mat-checkbox>

      <span style="flex: 1; margin-left: 10px;" [style.text-decoration]="todo.completed ? 'line-through' : 'none'">
        {{ todo.title }}
      </span>

      <button mat-icon-button color="accent" (click)="editTodo(todo)" aria-label="編輯待辦">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button color="warn" (click)="deleteTodo(todo._id)" aria-label="刪除待辦">
        <mat-icon>delete</mat-icon>
      </button>
    </mat-list-item>
  </mat-list>
</div>
